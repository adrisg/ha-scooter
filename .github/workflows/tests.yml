name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest-homeassistant-custom-component
      - name: Install requirements of the HA components we depend on
        run: |
          python - <<'EOF' > ha_reqs.txt
          import json, pathlib, homeassistant.components as c
          base = pathlib.Path(c.__file__).parent
          for comp in ("bluetooth", "bluetooth_adapters", "usb"):
              for r in json.loads((base / comp / "manifest.json").read_text()).get("requirements", []):
                  print(r)
          EOF
          cat ha_reqs.txt
          pip install -r ha_reqs.txt
      - run: python -c "import custom_components; print(custom_components.__path__)"
      - run: python -m pytest -v tests/

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  # The HACS validator (hacs/action) only works on public repositories.
